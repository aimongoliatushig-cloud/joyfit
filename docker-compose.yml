services:
  postgres:
    image: postgres:16-alpine
    container_name: joyfit-postgres
    environment:
      POSTGRES_USER: joyfit
      POSTGRES_PASSWORD: joyfitpass
      POSTGRES_DB: joyfit
    ports:
      - "5432:5432"
    volumes:
      - joyfit_pgdata:/var/lib/postgresql/data

volumes:
  joyfit_pgdata:
